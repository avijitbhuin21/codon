name: Codon CI

on:
  push:
    branches:
      - windows
      - master
      - develop
    tags:
      - 'v*'
  pull_request:
    branches:
      - windows
      - develop
  workflow_dispatch:

jobs:
  linux:
    name: Build Linux (x86_64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang automake

      - name: Cache LLVM
        id: cache-llvm
        uses: actions/cache@v4
        with:
          path: llvm
          key: linux-x86_64-llvm-17

      - name: Build Dependencies (LLVM)
        if: steps.cache-llvm.outputs.cache-hit != 'true'
        run: ./scripts/deps.sh $(nproc)
        env:
          CC: clang
          CXX: clang++

      - name: Build Codon
        run: |
          mkdir -p build
          export LLVM_DIR=$(llvm/bin/llvm-config --cmakedir)
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release \
                              -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
                              -DCMAKE_C_COMPILER=clang \
                              -DCMAKE_CXX_COMPILER=clang++ \
                              -DLLVM_DIR=$LLVM_DIR
          cmake --build build --config Release
          cmake --install build --prefix=codon-deploy

      - name: Package
        run: |
          if [ -e build/libunwind.so ]; then cp build/libunwind.so codon-deploy/lib/codon/; fi
          rm -rf codon-deploy/lib/libfmt.a codon-deploy/lib/pkgconfig codon-deploy/lib/cmake
          tar -czf codon-linux-x86_64.tar.gz codon-deploy
          du -sh codon-deploy

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: codon-linux-x86_64
          path: codon-linux-x86_64.tar.gz

      - name: Upload Release Asset
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: codon-linux-x86_64.tar.gz

  macos:
    name: Build macOS (arm64)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install build tools
        run: brew install automake

      - name: Cache LLVM
        id: cache-llvm
        uses: actions/cache@v4
        with:
          path: llvm
          key: darwin-arm64-llvm-17

      - name: Build Dependencies (LLVM)
        if: steps.cache-llvm.outputs.cache-hit != 'true'
        run: ./scripts/deps.sh $(sysctl -n hw.ncpu)
        env:
          CC: clang
          CXX: clang++

      - name: Build Codon
        run: |
          mkdir -p build
          export LLVM_DIR=$(llvm/bin/llvm-config --cmakedir)
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release \
                              -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
                              -DCMAKE_C_COMPILER=clang \
                              -DCMAKE_CXX_COMPILER=clang++ \
                              -DLLVM_DIR=$LLVM_DIR
          cmake --build build --config Release
          cmake --install build --prefix=codon-deploy

      - name: Package
        run: |
          rm -rf codon-deploy/lib/libfmt.a codon-deploy/lib/pkgconfig codon-deploy/lib/cmake
          tar -czf codon-darwin-arm64.tar.gz codon-deploy
          du -sh codon-deploy

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: codon-darwin-arm64
          path: codon-darwin-arm64.tar.gz

      - name: Upload Release Asset
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: codon-darwin-arm64.tar.gz

  windows:
    name: Build Windows (MSVC x86_64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64

      - name: Set up toolchain on PATH
        shell: pwsh
        run: |
          echo "C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          choco install ninja -y --no-progress
          clang --version
          ninja --version

      - name: Cache LLVM fork (MSVC)
        id: cache-llvm
        uses: actions/cache@v4
        with:
          path: llvm
          key: windows-msvc-llvm-17

      - name: Build Dependencies (LLVM 17 fork, MSVC)
        if: steps.cache-llvm.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          git clone --depth 1 -b release/17.x https://github.com/exaloop/llvm-project llvm-project
          cmake -S llvm-project/llvm -B llvm-build -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DLLVM_HOST_TRIPLE=x86_64-pc-windows-msvc `
            -DLLVM_DEFAULT_TARGET_TRIPLE=x86_64-pc-windows-msvc `
            -DCMAKE_C_COMPILER=clang `
            -DCMAKE_CXX_COMPILER=clang++ `
            -DLLVM_INCLUDE_TESTS=OFF `
            -DLLVM_INCLUDE_BENCHMARKS=OFF `
            -DLLVM_INCLUDE_EXAMPLES=OFF `
            -DLLVM_ENABLE_WERROR=OFF `
            -DLLVM_ENABLE_RTTI=OFF `
            -DLLVM_ENABLE_ZLIB=OFF `
            -DLLVM_ENABLE_TERMINFO=OFF `
            -DLLVM_TARGETS_TO_BUILD=X86 `
            -DLLVM_BUILD_TOOLS=OFF `
            -DLLVM_ENABLE_PROJECTS=""
          cmake --build llvm-build --config Release
          cmake --install llvm-build --prefix llvm

      - name: Build Codon
        shell: pwsh
        run: |
          cmake -S . -B build -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 `
            -DLLVM_DIR="llvm/lib/cmake/llvm" `
            -DCMAKE_C_COMPILER=clang `
            -DCMAKE_CXX_COMPILER=clang++ `
            -DCODON_GPU=OFF
          cmake --build build --config Release
          cmake --install build --prefix codon-deploy

      - name: Package
        shell: pwsh
        run: |
          Copy-Item codon-deploy/lib/codon/codonc.dll codon-deploy/bin/
          Copy-Item codon-deploy/lib/codon/codonrt.dll codon-deploy/bin/
          if (Test-Path codon-deploy/lib/codon/codon_jupyter.dll) {
            Copy-Item codon-deploy/lib/codon/codon_jupyter.dll codon-deploy/bin/
          }
          Compress-Archive -Path codon-deploy -DestinationPath codon-windows-x86_64.zip -Force

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: codon-windows-x86_64
          path: codon-windows-x86_64.zip

      - name: Upload Release Asset
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: codon-windows-x86_64.zip
